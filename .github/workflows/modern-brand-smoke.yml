name: Eco Waste Modern Brand Smoke Test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install and capture real branded app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -e
            chmod +x gradlew
            ./gradlew --no-daemon assembleRelease
            APK="app/build/outputs/apk/release/app-release.apk"
            apksigner verify --verbose --print-certs "$APK" | tee smoke-signature-report.txt
            adb install -r "$APK"

            # Real installed app icon rendered by Android Settings.
            adb shell am start -W -a android.settings.APPLICATION_DETAILS_SETTINGS -d package:com.ahmed.yawmeyaty >/dev/null
            sleep 2
            adb exec-out screencap -p > real-icon-app-info.png

            # Capture several real startup frames so the centered splash frame is reviewable.
            adb shell am force-stop com.ahmed.yawmeyaty
            (adb shell am start -n com.ahmed.yawmeyaty/.EcoWasteUpdateGateActivity >/dev/null 2>&1 &)
            mkdir -p splash-frames
            for i in $(seq -w 1 14); do
              adb exec-out screencap -p > "splash-frames/splash-$i.png" || true
              sleep 0.06
            done

            # Real login screen, bypassing remote update gate only inside smoke test.
            adb shell am force-stop com.ahmed.yawmeyaty
            adb shell run-as com.ahmed.yawmeyaty rm -f shared_prefs/eco_waste_phone_session.xml || true
            adb shell run-as com.ahmed.yawmeyaty am start -W -n com.ahmed.yawmeyaty/.EcoWasteModernActivity | tee login-start.txt
            sleep 2
            adb exec-out screencap -p > real-login.png

            # Real dashboard with a local test-only saved session; no network/data mutation.
            cat > staging-session.xml <<'EOF'
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map>
              <string name="email">staging@ecowaste.local</string>
              <string name="token">staging-token</string>
              <string name="refresh"></string>
              <string name="role">admin</string>
              <string name="name">مراجعة الهوية</string>
              <string name="login_phone">01000000000</string>
            </map>
            EOF
            adb shell am force-stop com.ahmed.yawmeyaty
            adb shell run-as com.ahmed.yawmeyaty mkdir -p shared_prefs
            adb exec-out run-as com.ahmed.yawmeyaty sh -c 'cat > shared_prefs/eco_waste_phone_session.xml' < staging-session.xml
            adb shell run-as com.ahmed.yawmeyaty am start -W -n com.ahmed.yawmeyaty/.EcoWasteModernActivity | tee dashboard-start.txt
            sleep 2
            adb exec-out screencap -p > real-dashboard.png

            adb logcat -d > app-launch-logcat.txt

      - name: Verify real app launch
        run: |
          grep -q "Status: ok" login-start.txt
          grep -q "Status: ok" dashboard-start.txt
          if grep -q "FATAL EXCEPTION" app-launch-logcat.txt; then
            grep -A120 -B30 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.ahmed.yawmeyaty" app-launch-logcat.txt || true
            exit 1
          fi

      - name: Upload real review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eco-Waste-4.3.3-Real-Screenshots
          path: |
            real-icon-app-info.png
            splash-frames/
            real-login.png
            real-dashboard.png
            smoke-signature-report.txt
            app-launch-logcat.txt
            login-start.txt
            dashboard-start.txt
          if-no-files-found: warn
          retention-days: 30
