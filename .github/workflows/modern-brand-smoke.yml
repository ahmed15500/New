name: Eco Waste Modern Brand Smoke Test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install and capture real branded app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon assembleRelease
            /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee smoke-signature-report.txt
            cp app/build/outputs/apk/release/app-release.apk Eco-Waste-v4.3.3-SADEEM-Staged.apk
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -a android.settings.APPLICATION_DETAILS_SETTINGS -d package:com.ahmed.yawmeyaty >/dev/null
            sleep 2
            adb exec-out screencap -p > real-icon-app-info.png
            adb shell am force-stop com.ahmed.yawmeyaty
            (adb shell am start -n com.ahmed.yawmeyaty/.EcoWasteUpdateGateActivity >/dev/null 2>&1 &) ; mkdir -p splash-frames ; for i in $(seq -w 1 20); do adb exec-out screencap -p > "splash-frames/splash-$i.png" || true; sleep 0.05; done
            adb uninstall com.ahmed.yawmeyaty
            ./gradlew --no-daemon assembleDebug
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.ahmed.yawmeyaty
            adb shell run-as com.ahmed.yawmeyaty rm -f shared_prefs/eco_waste_phone_session.xml || true
            adb shell run-as com.ahmed.yawmeyaty am start -W -n com.ahmed.yawmeyaty/.EcoWasteModernActivity | tee login-start.txt
            sleep 2
            adb exec-out screencap -p > real-login.png
            printf "%s" "<?xml version='1.0' encoding='utf-8' standalone='yes' ?><map><string name='email'>staging@ecowaste.local</string><string name='token'>staging-token</string><string name='refresh'></string><string name='role'>admin</string><string name='name'>مراجعة الهوية</string><string name='login_phone'>01000000000</string></map>" > staging-session.xml
            adb shell am force-stop com.ahmed.yawmeyaty
            adb shell run-as com.ahmed.yawmeyaty mkdir -p shared_prefs
            adb exec-out run-as com.ahmed.yawmeyaty sh -c 'cat > shared_prefs/eco_waste_phone_session.xml' < staging-session.xml
            adb shell run-as com.ahmed.yawmeyaty am start -W -n com.ahmed.yawmeyaty/.EcoWasteModernActivity | tee dashboard-start.txt
            sleep 2
            adb exec-out screencap -p > real-dashboard.png
            adb logcat -d > app-launch-logcat.txt

      - name: Verify real app launch
        run: |
          test -f Eco-Waste-v4.3.3-SADEEM-Staged.apk
          test -f real-login.png
          test -f real-dashboard.png
          grep -q "Status: ok" login-start.txt
          grep -q "Status: ok" dashboard-start.txt
          if grep -q "FATAL EXCEPTION" app-launch-logcat.txt; then
            grep -A120 -B30 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.ahmed.yawmeyaty" app-launch-logcat.txt || true
            exit 1
          fi

      - name: Upload staged APK and real review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eco-Waste-v4.3.3-Round3-Staged
          path: |
            Eco-Waste-v4.3.3-SADEEM-Staged.apk
            real-icon-app-info.png
            splash-frames/
            real-login.png
            real-dashboard.png
            smoke-signature-report.txt
            app-launch-logcat.txt
            login-start.txt
            dashboard-start.txt
          if-no-files-found: warn
          retention-days: 30
