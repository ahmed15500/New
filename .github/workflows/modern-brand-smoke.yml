name: Eco Waste Modern Brand Smoke Test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and launch modern Eco Waste on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.ahmed.yawmeyaty/.EcoWasteUpdateGateActivity | tee activity-start.txt
            sleep 10
            adb shell dumpsys activity activities | grep -E "EcoWaste(UpdateGate|Modern)Activity" | head -20 | tee foreground-activity.txt || true
            adb logcat -d > app-launch-logcat.txt
            adb exec-out screencap -p > modern-brand-screen.png

      - name: Verify modern app launch
        run: |
          grep -q "Status: ok" activity-start.txt
          if grep -q "FATAL EXCEPTION" app-launch-logcat.txt; then
            grep -A120 -B30 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.ahmed.yawmeyaty" app-launch-logcat.txt || true
            exit 1
          fi
          grep -Eq "EcoWaste(UpdateGate|Modern)Activity" foreground-activity.txt

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eco-Waste-4.3.0-Modern-Launch-Evidence
          path: |
            activity-start.txt
            foreground-activity.txt
            app-launch-logcat.txt
            modern-brand-screen.png
          if-no-files-found: warn
          retention-days: 14