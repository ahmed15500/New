name: Eco Waste Modern Brand Smoke Test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact v4.3.3 review branch
        uses: actions/checkout@v4
        with:
          ref: review/v4.3.3-sadeem-branding

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and launch modern Eco Waste on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c

            adb shell am start -a android.settings.APPLICATION_DETAILS_SETTINGS -d package:com.ahmed.yawmeyaty
            sleep 2
            adb exec-out screencap -p > 01-app-icon.png

            adb shell am force-stop com.ahmed.yawmeyaty
            adb shell am start -n com.ahmed.yawmeyaty/.EcoWasteUpdateGateActivity >/dev/null &
            sleep 0.10
            adb exec-out screencap -p > 02-splash.png

            adb shell pm clear com.ahmed.yawmeyaty >/dev/null
            adb shell am start -W -n com.ahmed.yawmeyaty/.EcoWasteUpdateGateActivity | tee activity-start.txt
            sleep 6
            adb shell dumpsys activity activities | grep -E "EcoWaste(UpdateGate|Modern)Activity" | head -20 | tee foreground-activity.txt || true
            adb exec-out screencap -p > 03-login.png

            adb shell run-as com.ahmed.yawmeyaty mkdir -p shared_prefs
            adb shell run-as com.ahmed.yawmeyaty sh -c 'echo "<map><string name=\"email\">review@local</string><string name=\"token\">review</string><string name=\"refresh\"></string><string name=\"role\">admin</string><string name=\"name\">Ahmed</string><string name=\"login_phone\">01000000000</string></map>" > shared_prefs/eco_waste_phone_session.xml'
            adb shell am force-stop com.ahmed.yawmeyaty
            adb shell am start -W -n com.ahmed.yawmeyaty/.EcoWasteModernActivity | tee dashboard-start.txt
            sleep 2
            adb exec-out screencap -p > 04-dashboard.png

            adb logcat -d > app-launch-logcat.txt

      - name: Verify modern app launch
        run: |
          grep -q "Status: ok" activity-start.txt
          if grep -q "FATAL EXCEPTION" app-launch-logcat.txt; then
            grep -A120 -B30 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.ahmed.yawmeyaty" app-launch-logcat.txt || true
            exit 1
          fi
          grep -Eq "EcoWaste(UpdateGate|Modern)Activity" foreground-activity.txt

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eco-Waste-v4.3.3-Real-Screens-Part1
          path: |
            activity-start.txt
            foreground-activity.txt
            app-launch-logcat.txt
            01-app-icon.png
            02-splash.png
            03-login.png
            04-dashboard.png
            dashboard-start.txt
          if-no-files-found: warn
          retention-days: 14