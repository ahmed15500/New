name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply subscription and signing compatibility
        run: python3 .github/scripts/apply_v431.py

      - name: Apply generic login phone example
        run: python3 .github/scripts/apply_v432.py

      - name: Verify admin phone is not shown as placeholder
        run: |
          grep -q 'placeholder = { Text("مثال: 01XXXXXXXXX") }' app/src/main/java/com/ahmed/yawmeyaty/EcoWasteModernActivity.kt
          if grep -q 'placeholder = { Text("01208097044") }' app/src/main/java/com/ahmed/yawmeyaty/EcoWasteModernActivity.kt; then
            echo "Admin phone is still exposed in the login placeholder."
            exit 1
          fi

      - name: Create persistent signing key once
        run: |
          if [ ! -f app/ecowaste-release.jks ]; then
            keytool -genkeypair \
              -keystore app/ecowaste-release.jks \
              -storepass EcoWasteStable431 \
              -keypass EcoWasteStable431 \
              -alias ecowaste \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Eco Waste, OU=Eco Waste App, O=Heliopolis University, L=Cairo, ST=Cairo, C=EG" \
              -storetype JKS \
              -noprompt
          fi

      - name: Persist source patch and signing key
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "Eco Waste Release Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/ahmed/yawmeyaty/EcoWasteModernActivity.kt app/ecowaste-release.jks
          git diff --cached --quiet || git commit -m "Use a generic phone example on login"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build-log.txt

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          apksigner verify --verbose --print-certs "$APK" | tee signature-report.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eco-Waste-Build-Evidence
          path: |
            build-log.txt
            signature-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Rename APK
        if: success()
        run: cp app/build/outputs/apk/release/app-release.apk Eco-Waste-v4.3.2-Stable-Signed.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Eco-Waste-APK
          path: Eco-Waste-v4.3.2-Stable-Signed.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish stable APK link
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p releases
          cp Eco-Waste-v4.3.2-Stable-Signed.apk releases/Eco-Waste-latest.apk
          cp Eco-Waste-v4.3.2-Stable-Signed.apk releases/Eco-Waste-v4.3.2.apk
          git config user.name "Eco Waste Release Bot"
          git config user.email "actions@github.com"
          git add releases/Eco-Waste-latest.apk releases/Eco-Waste-v4.3.2.apk
          git commit -m "Publish Eco Waste 4.3.2 signed APK [skip ci]" || exit 0
          git push origin main
