name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Repair Compose import
        if: github.event_name == 'pull_request'
        run: |
          FILE="app/src/main/java/com/ahmed/yawmeyaty/EcoWasteModernActivity.kt"
          if grep -q '^import androidx.compose.foundation.layout.weight$' "$FILE"; then
            sed -i '/^import androidx.compose.foundation.layout.weight$/d' "$FILE"
            git config user.name "Eco Waste CI"
            git config user.email "actions@github.com"
            git add "$FILE"
            git commit -m "Fix Compose weight import"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eco-Waste-Build-Log
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk Eco-Waste-v4.3.0-Modern-Brand.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Eco-Waste-APK
          path: Eco-Waste-v4.3.0-Modern-Brand.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK link
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p releases
          cp Eco-Waste-v4.3.0-Modern-Brand.apk releases/Eco-Waste-latest.apk
          cp Eco-Waste-v4.3.0-Modern-Brand.apk releases/Eco-Waste-v4.3.0.apk
          git config user.name "Eco Waste Release Bot"
          git config user.email "actions@github.com"
          git add releases/Eco-Waste-latest.apk releases/Eco-Waste-v4.3.0.apk
          git commit -m "Publish Eco Waste 4.3.0 APK [skip ci]" || exit 0
          git push origin main