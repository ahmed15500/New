name: v4.3.3 Staged Release

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build signed release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon assembleRelease
            /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signature-report.txt
            cp app/build/outputs/apk/release/app-release.apk Eco-Waste-v4.3.3-SADEEM-Staged.apk
      - name: Upload staged release
        uses: actions/upload-artifact@v4
        with:
          name: Eco-Waste-v4.3.3-Release
          path: |
            Eco-Waste-v4.3.3-SADEEM-Staged.apk
            signature-report.txt
          if-no-files-found: error
          retention-days: 30
